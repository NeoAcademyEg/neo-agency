<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Agency | Kick-Off Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EADD;--paper:#FAF5EC;--ink:#141416;--mut:#6B666A;--ac:#B62922;--ac2:#8E1D18;--line:#D3C7B1;--err:#8E1D18}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:minmax(320px,420px) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--ink);color:var(--bg);overflow:hidden}
.side::before{content:'';position:absolute;width:460px;height:460px;right:-330px;bottom:-400px;border-radius:50%;border:56px solid var(--ac);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 0 0 2px rgba(0,0,0,.25)}
.side::after{content:'';position:absolute;width:250px;height:20px;border-radius:10px;background:var(--ac);transform:rotate(-45deg);top:34px;right:-110px}
.sin{position:relative;z-index:1;height:100%;padding:26px 44px 40px 30px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:block;width:76px;height:76px;margin-bottom:12px}
.eyebrow{font:700 12px/1 Cairo,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin-bottom:18px}
.side .eyebrow{color:#E0524A}
.tag{font:400 34px/1.1 'Archivo Black',Cairo,sans-serif;margin:0 0 34px;letter-spacing:-.01em}
.tag em{font-style:normal;color:#E0524A}
#steps{list-style:none;margin:0;padding:0;max-width:300px}
#steps li{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid rgba(242,234,221,.14);color:rgba(242,234,221,.5);transition:color .3s}
#steps i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(242,234,221,.28);font:400 11px/1 'Archivo Black',sans-serif;font-style:normal;margin-top:2px;transition:all .3s}
#steps span{font-weight:600;line-height:1.35}
#steps small{display:block;font-weight:400;font-size:13px;opacity:.75}
#steps li.now{color:#fff}
#steps li.now i{background:var(--ac);border-color:var(--ac);color:#fff}
#steps li.done i{border-color:#E0524A;color:#E0524A}
.foot{font:600 11px/1.7 Cairo,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,234,221,.55)}
main{padding:72px clamp(24px,6vw,96px) 100px}
#app{max-width:600px}
.screen{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.bar{display:none;gap:6px;margin-bottom:28px}
.bar span{flex:1;height:3px;background:var(--line);border-radius:2px}
.bar span.on{background:var(--ac)}
#app .eyebrow{color:var(--ac)}
h1{font:400 clamp(30px,3.6vw,42px)/1.1 'Archivo Black',Cairo,sans-serif;letter-spacing:-.01em;margin:0 0 10px}
.sub{margin:0 0 40px;color:var(--mut);direction:rtl;text-align:right;font-size:18px}
.lead{font-size:19px;margin:0 0 6px}
.q{margin-bottom:30px}
.q .en{font-weight:700;font-size:17px;display:block;line-height:1.4}
.q .ar{display:block;direction:rtl;text-align:right;color:var(--mut);font-size:15px;margin:2px 0 10px}
.req::after{content:" *";color:var(--ac)}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;transition:border-color .2s,box-shadow .2s,background .2s}
textarea{min-height:100px;resize:vertical}
input:hover,textarea:hover{border-color:#B9AB92}
input:focus,textarea:focus{outline:0;border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(182,41,34,.14)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:inherit;text-align:center;background:rgba(255,255,255,.55);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer;line-height:1.35;transition:all .2s}
.opt:hover{border-color:var(--ink)}
.opt small{display:block;direction:rtl;color:var(--mut);font-size:13px}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff;animation:tap .25s ease}
.opt.on small{color:rgba(255,255,255,.7)}
.bad .opt,.bad input,.bad textarea{border-color:var(--err)}
.bad .en{color:var(--err)}
.err{color:var(--err);font-weight:600;min-height:56px}
.err span{display:block;direction:rtl;text-align:right}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:26px;border-top:1px solid var(--line)}
.btn{font:700 16px/1.25 Cairo,sans-serif;border:1.5px solid var(--ac);border-radius:999px;padding:13px 32px;cursor:pointer;background:var(--ac);color:#fff;transition:all .2s;text-align:center}
.btn span{display:block}
.btn span+span{font-weight:400;font-size:13px;opacity:.85}
.btn:hover{background:var(--ac2);border-color:var(--ac2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.nav .btn:not(.ghost) span:first-child::after{content:"  \2192"}
.nav .ghost span:first-child::before{content:"\2190  "}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.pick{display:grid;gap:16px}
.card{display:flex;align-items:center;gap:22px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:24px 26px;cursor:pointer;transition:all .25s;animation:rise .5s ease both}
.card:nth-child(2){animation-delay:.1s}
.card:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 18px 34px -22px rgba(41,40,45,.55)}
.num{font:400 30px/1 'Archivo Black',sans-serif;color:var(--ac)}
.ct{flex:1}.ct b{display:block;font-size:19px;line-height:1.3}
.ct small{display:block;direction:rtl;text-align:left;color:var(--mut);font-size:15px;margin-top:2px}
.arr{font-size:24px;transition:transform .25s}
.card:hover .arr{transform:translateX(6px);color:var(--ac)}
.ok{width:76px;height:76px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin-bottom:28px;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.ok svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes tap{from{transform:scale(.94)}to{transform:none}}
@media(max-width:880px){
.shell{display:block}
.side{position:relative;height:auto}
.side::before,.side::after,.foot,#steps,.side .eyebrow{display:none}
.sin{flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:14px 20px}
.logo{width:48px;height:48px}
.tag{font-size:15px;margin:0}.tag br{display:none}
main{padding:28px 20px 80px}
.bar{display:flex}
}
@media(max-width:480px){.btn{padding:12px 22px}.card{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

Q('what','p','What do you provide?','ما الخدمة أو المنتج الذي تقدمه؟',0,1)]],
['Business and audience','النشاط والجمهور',[

Q('aud','p','Who is your ideal customer? (age, interests, location)','من هو عميلك المثالي؟ (العمر، الاهتمامات، المكان)',0,1),
Q('comp','p','Who are your main competitors?','من هم أهم منافسيك؟'),
Q('diff','p','What makes you different from them?','ما الذي يميزك عنهم؟')]],
['Brand personality','شخصية العلامة',[

Q('feel','p','How should customers feel after dealing with you?','بماذا تريد أن يشعر العميل بعد التعامل معك؟'),

['Visual direction','الاتجاه البصري',[

Q('ref','p','Links to brands or designs you like, and what you like about them','روابط لعلامات أو تصاميم تعجبك، وما الذي يعجبك فيها'),

Q('old','r','Do you have an existing logo?','هل لديك شعار حالي؟','No, from scratch|لا، من الصفر;Yes, redesign it|نعم، أريد تطويره;Yes, keep it|نعم، أريد الإبقاء عليه')]],
['Delivery and contact','التسليم والتواصل',[

Q('bud','t','Budget range','الميزانية التقريبية')].concat(NAME)]]},

general:{en:'General project questionnaire',ar:'استبيان المشروع العام',S:[

Q('desc','p','What does your business do?','ما هو نشاطك؟',0,1)].concat(NAME)],
['What you need','ما الذي تحتاجه',[
Q('svc','m','Which services do you need?','ما الخدمات التي تحتاجها؟','Brand identity|هوية بصرية;Social media designs|تصاميم سوشيال ميديا;Social media management|إدارة السوشيال ميديا;Packaging|تغليف;Print and ads|مطبوعات وإعلانات;Website or app design|تصميم موقع أو تطبيق;Motion and video|موشن وفيديو;Other|أخرى',1)]],
['Goals and audience','الهدف والجمهور',[

Q('pt','p','What do you need to print or advertise, and in what sizes?','ما الذي تريد طباعته أو الإعلان عنه، وبأي مقاسات؟',0,0,['svc','Print']),

Q('oth','p','Tell us what you need','أخبرنا بما تحتاجه',0,0,['svc','Other'])]],

let F,K,si=0,A={};
const app=document.getElementById('app');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const vis=q=>!q.s||(A[q.s[0]]||[]).some(v=>v.startsWith(q.s[1]));
const secs=()=>F.S.map(s=>({en:s[0],ar:s[1],q:s[2].filter(vis)})).filter(s=>s.q.length);
const bi=(en,ar)=>{const f=document.createDocumentFragment();f.append(el('span',0,en),el('span',0,ar));return f};

const stepsEl=document.getElementById('steps');
const anim=()=>{app.classList.remove('screen');void app.offsetWidth;app.classList.add('screen')};
function side(S,si){stepsEl.replaceChildren();S.forEach((s,i)=>{const li=el('li',i<si?'done':i===si?'now':''),t=el('span');t.append(s.en,el('small',0,s.ar));li.append(el('i',0,i<si?'\u2713':String(i+1).padStart(2,'0')),t);stepsEl.append(li)})}
function pick(){
  app.replaceChildren();stepsEl.replaceChildren();
  app.append(el('div','eyebrow','New project brief'),el('h1',0,'Let\u2019s get to know your project'),el('p','sub','دعنا نتعرف على مشروعك'));
  const w=el('div','pick');let n=0;
  for(const k in FORMS){const b=el('button','card'),c=el('span','ct');b.type='button';
    c.append(el('b',0,FORMS[k].en),el('small',0,FORMS[k].ar));
    b.append(el('span','num',String(++n).padStart(2,'0')),c,el('span','arr','\u2192'));b.onclick=()=>start(k);w.append(b)}
  app.append(w);anim();
}
function start(k){K=k;F=FORMS[k];A={};si=0;draw()}

function field(q){
  const d=el('div','q');d.dataset.id=q.id;
  const en=el('span','en'+(q.r?' req':''),q.en);
  d.append(en,el('span','ar',q.ar));
  if(q.t==='t'||q.t==='p'){
    const i=el(q.t==='t'?'input':'textarea');i.dir='auto';i.value=A[q.id]||'';
    i.oninput=()=>{A[q.id]=i.value;d.classList.remove('bad')};d.append(i);
  }else{
    const w=el('div','opts'),multi=q.t==='m';
    q.o.forEach(([e,a])=>{
      const b=el('button','opt',e);b.type='button';b.append(el('small',0,a));
      const cur=()=>multi?(A[q.id]||[]):[A[q.id]];
      if(cur().includes(e))b.classList.add('on');
      b.onclick=()=>{
        d.classList.remove('bad');
        if(multi){let v=A[q.id]||[];
          if(v.includes(e))v=v.filter(x=>x!==e);else if(q.id!=='pers'||v.length<5)v=v.concat(e);
          A[q.id]=v;
        }else A[q.id]=e;
        w.querySelectorAll('.opt').forEach((x,i)=>x.classList.toggle('on',cur().includes(q.o[i][0])));
      };
      w.append(b);
    });
    d.append(w);
  }
  return d;
}

function draw(){
  const S=secs();si=Math.min(si,S.length-1);const s=S[si];
  app.replaceChildren();
  const bar=el('div','bar');S.forEach((_,i)=>bar.append(el('span',i<=si?'on':'')));
  const eb=el('div','eyebrow','Step '+String(si+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0'));
  app.append(bar,eb,el('h1',0,s.en),el('p','sub',s.ar));side(S,si);
  s.q.forEach(q=>app.append(field(q)));
  const err=el('div','err');err.setAttribute('role','alert');
  const nav=el('div','nav');
  const back=el('button','btn ghost');back.append(bi('Back','رجوع'));
  back.style.visibility=si?'visible':'hidden';
  back.onclick=()=>{si--;draw();scrollTo(0,0)};
  const last=si===S.length-1;
  const next=el('button','btn');next.append(last?bi('Send','إرسال'):bi('Next','التالي'));
  next.onclick=()=>{
    let bad=0;
    s.q.forEach(q=>{const v=A[q.id];const miss=q.r&&(!v||!v.length||(typeof v==='string'&&!v.trim()));
      app.querySelector('[data-id="'+q.id+'"]').classList.toggle('bad',!!miss);bad+=miss?1:0});
    if(bad){err.replaceChildren(el('span',0,'Please answer the required questions.'),el('span',0,'من فضلك أجب عن الأسئلة المطلوبة.'));
      app.querySelector('.bad').scrollIntoView({block:'center'});return}
    if(last)send(next,err);else{si++;draw();scrollTo(0,0)}
  };
  nav.append(back,next);app.append(err,nav);anim();
}

async function send(btn,err){
  const answers={};
  secs().forEach(s=>s.q.forEach(q=>{const v=A[q.id];if(v&&v.length)answers[q.en]=Array.isArray(v)?v.join(' | '):v.trim()}));
  btn.disabled=true;
  try{
    if(SCRIPT_URL.startsWith('PASTE'))throw new Error('no url');
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:K,answers})});
    const nm=(A.nm||'').trim().split(/\s+/)[0],ok=el('div','ok');
    ok.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';scrollTo(0,0);stepsEl.replaceChildren();
    app.replaceChildren(ok,el('div','eyebrow','Brief received'),el('h1',0,nm?'Thank you, '+nm+'.':'Thank you.'),el('p','lead','We received your answers and will be in touch soon.'),el('p','sub','شكراً لك. تم استلام إجاباتك وسنتواصل معك قريباً.'));anim();
  }catch(e){
    btn.disabled=false;
    err.replaceChildren(el('span',0,'Could not send. Check your connection and try again.'),el('span',0,'تعذر الإرسال. تأكد من الاتصال وحاول مرة أخرى.'));
  }
}

const t=new URLSearchParams(location.search).get('type');
if(FORMS[t])start(t);else pick();
</script>
