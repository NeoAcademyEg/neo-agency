<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Agency | Kick-Off Questionnaire</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EDE1;--ink:#1E1E1E;--mut:#5B6670;--ac:#C0392B;--navy:#2E4A5C;--mus:#E8B94A;--line:#D8CDB9;--card:#FBF7EF;--err:#9B1C1C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Cairo,system-ui,sans-serif}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 20px 80px}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none}
body::before{width:130px;height:130px;background:var(--mus);top:-50px;right:-40px}
body::after{display:none;width:360px;height:360px;background:var(--ac);bottom:-190px;left:-150px}
@media(min-width:900px){body::before{width:240px;height:240px;top:-90px;right:-60px}body::after{display:block}}
.top{margin-bottom:26px}.top::after{content:'';display:block;width:36px;height:4px;background:var(--mus);margin-top:10px}
.brand{display:flex;align-items:center;gap:12px}
.bt{font:400 36px/.9 'Archivo Black',Cairo,sans-serif;color:var(--ac)}.bt small{display:block;font-size:18px;color:var(--navy);margin-top:4px}
.brand svg{width:54px;height:54px;flex:none}.logo-bg{fill:var(--navy)}
.bar{display:flex;gap:6px;margin-bottom:32px}
.bar span{flex:1;height:4px;background:var(--line);border-radius:2px}
.bar span.on{background:var(--ac);transform-origin:left;animation:fill .5s ease both}
h1{font:400 30px/1.25 'Archivo Black',Cairo,sans-serif;margin:0 0 4px}
.sub{margin:0 0 32px;color:var(--mut);direction:rtl;text-align:right;font-size:18px}
.q{margin-bottom:28px}
.q .en{font-weight:600;display:block}
.q .ar{display:block;direction:rtl;text-align:right;color:var(--mut);margin-bottom:8px}
.req::after{content:" *";color:var(--ac)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 13px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,.opt:focus-visible,button:focus-visible{outline:3px solid var(--navy);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;text-align:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;line-height:1.35}
.opt small{display:block;direction:rtl;color:var(--mut);font-size:14px}
.opt.on{animation:tap .25s ease;background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on small{color:#dbe4ea}
.bad .opt,.bad input,.bad textarea{border-color:var(--err)}
.err{color:var(--err);font-weight:600;min-height:52px}
.err span{display:block;direction:rtl;text-align:right}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.btn{font:600 16px Cairo,sans-serif;border:0;border-radius:8px;padding:12px 26px;cursor:pointer;background:var(--ac);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.pick{display:grid;gap:14px;margin-top:8px}
.pick .btn{text-align:left;padding:20px 22px;font-size:19px}
.pick .btn small{display:block;direction:rtl;text-align:right;font-weight:400;font-size:16px;color:#fff;opacity:.85;margin-top:2px}
.panda{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.panda img{flex:none;width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--mus);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.say{position:relative;background:var(--navy);color:#fff;border-radius:14px 14px 14px 4px;padding:8px 14px;font-weight:600;line-height:1.4;animation:rise .5s .15s ease both}
.say small{display:block;direction:rtl;font-weight:400;font-size:14px;opacity:.85}
.hero{display:grid;grid-template-columns:1fr 150px;gap:18px;align-items:end;margin-bottom:8px}
.hero-img{width:150px;border-radius:22px;display:block;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both,bob 3.5s 1s ease-in-out infinite}
.pick .btn{transition:transform .2s,box-shadow .2s;animation:rise .5s ease both}
.pick .btn:nth-child(1){animation-delay:.25s}.pick .btn:nth-child(2){background:var(--navy);animation-delay:.4s}
.pick .btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--mus)}
.done-img{width:100%;border-radius:20px;display:block;margin-bottom:24px;animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes tap{from{transform:scale(.92)}to{transform:none}}
@media(max-width:480px){h1{font-size:25px}.hero{grid-template-columns:1fr 112px}.hero-img{width:112px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

Q('ref','p','Links to work you like','روابط لأعمال تعجبك'),
Q('dl','t','Preferred delivery date','الموعد المفضل للتسليم'),
Q('bud','t','Budget range','الميزانية التقريبية'),
Q('more','p','Anything else we should know?','هل هناك أي شيء آخر نحتاج معرفته؟')]]]}};

let F,K,si=0,A={};
const app=document.getElementById('app');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const vis=q=>!q.s||(A[q.s[0]]||[]).some(v=>v.startsWith(q.s[1]));
const secs=()=>F.S.map(s=>({en:s[0],ar:s[1],q:s[2].filter(vis)})).filter(s=>s.q.length);
const bi=(en,ar)=>{const f=document.createDocumentFragment();f.append(el('span',0,en),el('span',0,ar));return f};

function pick(){
  app.replaceChildren();
  const hr=el('div','hero'),tx=el('div'),hi=el('img','hero-img');hi.src=IMG.hero;hi.alt='';
  tx.append(el('h1',0,'Let\u2019s get to know your project'),el('p','sub','دعنا نتعرف على مشروعك'));hr.append(tx,hi);app.append(hr);
  const w=el('div','pick');
  for(const k in FORMS){const b=el('button','btn',FORMS[k].en);b.append(el('small',0,FORMS[k].ar));b.onclick=()=>start(k);w.append(b)}
  app.append(w);
}
function start(k){K=k;F=FORMS[k];A={};si=0;draw()}

function field(q){
  const d=el('div','q');d.dataset.id=q.id;
  const en=el('span','en'+(q.r?' req':''),q.en);
  d.append(en,el('span','ar',q.ar));
  if(q.t==='t'||q.t==='p'){
    const i=el(q.t==='t'?'input':'textarea');i.dir='auto';i.value=A[q.id]||'';
    i.oninput=()=>{A[q.id]=i.value;d.classList.remove('bad')};d.append(i);
  }else{
    const w=el('div','opts'),multi=q.t==='m';
    q.o.forEach(([e,a])=>{
      const b=el('button','opt',e);b.type='button';b.append(el('small',0,a));
      const cur=()=>multi?(A[q.id]||[]):[A[q.id]];
      if(cur().includes(e))b.classList.add('on');
      b.onclick=()=>{
        d.classList.remove('bad');
        if(multi){let v=A[q.id]||[];
          if(v.includes(e))v=v.filter(x=>x!==e);else if(q.id!=='pers'||v.length<5)v=v.concat(e);
          A[q.id]=v;
        }else A[q.id]=e;
        w.querySelectorAll('.opt').forEach((x,i)=>x.classList.toggle('on',cur().includes(q.o[i][0])));
      };
      w.append(b);
    });
    d.append(w);
  }
  return d;
}

function draw(){
  const S=secs();si=Math.min(si,S.length-1);const s=S[si];
  app.replaceChildren();
  const bar=el('div','bar');S.forEach((_,i)=>bar.append(el('span',i<=si?'on':'')));
  const pd=el('div','panda'),pi=el('img'),sy=el('div','say'),m=MSG[si===0?0:si===S.length-1?2:1];
  pi.src=IMG.av;pi.alt='';sy.append(el('span',0,m[0]),el('small',0,m[1]));pd.append(pi,sy);
  app.append(bar,pd,el('h1',0,s.en),el('p','sub',s.ar));
  s.q.forEach(q=>app.append(field(q)));
  const err=el('div','err');err.setAttribute('role','alert');
  const nav=el('div','nav');
  const back=el('button','btn ghost');back.append(bi('Back','رجوع'));
  back.style.visibility=si?'visible':'hidden';
  back.onclick=()=>{si--;draw();scrollTo(0,0)};
  const last=si===S.length-1;
  const next=el('button','btn');next.append(last?bi('Send','إرسال'):bi('Next','التالي'));
  next.onclick=()=>{
    let bad=0;
    s.q.forEach(q=>{const v=A[q.id];const miss=q.r&&(!v||!v.length||(typeof v==='string'&&!v.trim()));
      app.querySelector('[data-id="'+q.id+'"]').classList.toggle('bad',!!miss);bad+=miss?1:0});
    if(bad){err.replaceChildren(el('span',0,'Please answer the required questions.'),el('span',0,'من فضلك أجب عن الأسئلة المطلوبة.'));
      app.querySelector('.bad').scrollIntoView({block:'center'});return}
    if(last)send(next,err);else{si++;draw();scrollTo(0,0)}
  };
  nav.append(back,next);app.append(err,nav);
}

async function send(btn,err){
  const answers={};
  secs().forEach(s=>s.q.forEach(q=>{const v=A[q.id];if(v&&v.length)answers[q.en]=Array.isArray(v)?v.join(' | '):v.trim()}));
  btn.disabled=true;
  try{
    if(SCRIPT_URL.startsWith('PASTE'))throw new Error('no url');
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:K,answers})});
    const im=el('img','done-img');im.src=IMG.ban;im.alt='';scrollTo(0,0);
    app.replaceChildren(im,el('h1',0,'Thank you. We received your answers.'),el('p','sub','شكراً لك. تم استلام إجاباتك وسنتواصل معك قريباً.'));
  }catch(e){
    btn.disabled=false;
    err.replaceChildren(el('span',0,'Could not send. Check your connection and try again.'),el('span',0,'تعذر الإرسال. تأكد من الاتصال وحاول مرة أخرى.'));
  }
}

const t=new URLSearchParams(location.search).get('type');
if(FORMS[t])start(t);else pick();
</script>
</body>
</html>
